<script>
  // Hide loader once React mounts
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('done');
        setTimeout(() => loader.remove(), 500);
      }
    }, 600);
  });
